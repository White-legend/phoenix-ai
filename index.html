<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Phoenix AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0b0f;
            color: white;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 65px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #292929;
            font-size: 21px;
            font-weight: bold;
        }

        .logo {
            margin-right: 10px;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .welcome {
            text-align: center;
            margin-top: 25vh;
        }

        .welcome h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #999;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            margin: 12px 0;
            border-radius: 16px;
            line-height: 1.5;
        }

        .user {
            background: #d97706;
            margin-left: auto;
        }

        .ai {
            background: #24242a;
            margin-right: auto;
        }

        .input-area {
            display: flex;
            padding: 12px;
            border-top: 1px solid #292929;
            background: #111116;
        }

        #messageInput {
            flex: 1;
            padding: 14px;
            border: 1px solid #333;
            border-radius: 14px;
            background: #202027;
            color: white;
            outline: none;
            font-size: 16px;
        }

        #sendButton {
            width: 52px;
            margin-left: 10px;
            border: none;
            border-radius: 14px;
            background: #d97706;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        #sendButton:hover {
            background: #f59e0b;
        }
    </style>
</head>

<body>

<header>
    <span class="logo">🔥</span>
    Phoenix AI
</header>

<div id="chat">

    <div class="welcome" id="welcome">
        <h1>🔥 Phoenix AI</h1>
        <p>How can I help you today?</p>
    </div>

</div>

<div class="input-area">

    <input
        id="messageInput"
        type="text"
        placeholder="Message Phoenix AI..."
        autocomplete="off"
    >

    <button id="sendButton">➤</button>

</div>

<script>

    const input = document.getElementById("messageInput");
    const button = document.getElementById("sendButton");
    const chat = document.getElementById("chat");

    function sendMessage() {

        const message = input.value.trim();

        if (message === "") {
            return;
        }

        const welcome = document.getElementById("welcome");

        if (welcome) {
            welcome.remove();
        }

        const userMessage = document.createElement("div");

        userMessage.className = "message user";
        userMessage.textContent = message;

        chat.appendChild(userMessage);

        input.value = "";

        const aiMessage = document.createElement("div");

        aiMessage.className = "message ai";
        aiMessage.textContent = "Phoenix AI is thinking... 🔥";

        chat.appendChild(aiMessage);

        chat.scrollTop = chat.scrollHeight;
    }

    button.addEventListener("click", sendMessage);

    input.addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            sendMessage();
        }

    });

</script>

</body>
</html>
